<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一拍即合 · 碰撞 — 宣传片</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <style>
    :root { --paper: #f4f3e9; --ink: #162b32; --coral: #ef765c; --mono: "DM Mono", "SF Mono", Menlo, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 14px; background: var(--ink); color: var(--paper); font-family: var(--mono); }
    .frame { width: min(96vw, calc((100vh - 90px) * 16 / 9)); aspect-ratio: 16 / 9; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
    canvas { width: 100%; height: 100%; display: block; background: var(--paper); }
    .bar { width: min(96vw, calc((100vh - 90px) * 16 / 9)); display: flex; align-items: center; gap: 14px; font-size: 13px; }
    a { color: var(--paper); font-size: 12px; text-underline-offset: 4px; }
    .links { display:flex; gap:24px; padding:12px; }
    button { border: 1px solid var(--paper); background: transparent; color: var(--paper); font: inherit; padding: 6px 14px; cursor: pointer; }
    button:hover { background: var(--paper); color: var(--ink); }
    input[type=range] { flex: 1; accent-color: var(--coral); }
    output { min-width: 92px; text-align: right; }
    body.record .bar { display: none; }
    body.record { display: block; background: var(--paper); }
    body.record .frame { width: 1920px; height: 1080px; box-shadow: none; }
  </style>
</head>
<body>
  <div class="frame"><canvas id="film" width="1920" height="1080" aria-label="一拍即合 碰撞主题宣传片"></canvas></div>
  <div class="bar">
    <button id="play">▶ 播放</button>
    <button id="sound" aria-pressed="true">♪ 有声</button>
    <input id="scrub" type="range" min="0" max="30" step="0.01" value="0" aria-label="时间轴">
    <output id="time">0.00 s</output>
  </div>
  <nav class="links"><a href="../index.html">← 回去开拍</a><a href="./film.html">观看成片 MP4 ↗</a></nav>
  <script type="module" src="./player.mjs"></script>
</body>
</html>
